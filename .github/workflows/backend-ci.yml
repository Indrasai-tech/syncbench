name: backend-ci
on:
  push:
    paths: ["backend/**", "scenarios/**", ".github/workflows/backend-ci.yml"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"
      - run: swift build -c release
      - run: swift test
      - name: Scenario comparison smoke run
        run: swift run -c release syncbench-server compare
