name: backend-ci
on:
  push:
    paths: ["backend/**", "scenarios/**", "scripts/**", ".github/workflows/backend-ci.yml"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Comparison table (informational)
        working-directory: .
        run: python scripts/compare_implementations.py
