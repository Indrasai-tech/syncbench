name: ios-ci
on:
  push:
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Pick an available iPhone simulator
        run: |
          ID=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "SIM_ID=$ID" >> "$GITHUB_ENV"
      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild test -project SyncBench.xcodeproj -scheme SyncBench \
            -destination "id=$SIM_ID" CODE_SIGNING_ALLOWED=NO
