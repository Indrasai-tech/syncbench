services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      API_KEY: ${API_KEY:-}
      DATA_DIR: /app/data
      SCENARIOS_DIR: /app/scenarios
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - syncbench-data:/app/data

volumes:
  syncbench-data:
